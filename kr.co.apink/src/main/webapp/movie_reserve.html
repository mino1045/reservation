<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영화예매 사이트</title>
    <link rel="stylesheet" href="./movie_reserve.css">
</head>
<body>

    <form id="frm" action="./movie_reservok.do" method="post" onsubmit="reserve()">
        <h1>영화 예약 시스템</h1>
        <!--영화고유코드  -->
        <input type="hidden" name="moviecode" value="402">
        <!--예매고객의 고유 코드 js난수로 생성  -->
		<input type="hidden" name="usercode" value="">
        <label for="movie">영화명:</label>
        <input type="text" id="movienm" name="movienm" value="거룩한 밤:데몬헌터스" readonly>
        <br><br>
        <label for="name">예약자:</label>
        <input type="text" id="mname" name="mname" required>
        <br><br>
        <label for="date">예약일:</label>
        <input type="date" id="mdate" name="mdate" required>
        <br><br>

        <label for="time">예약시간:</label>
        <select id="reservation-time" name="mtime">
            <option value="10:00">오전 10:00</option>
            <option value="12:00">오후 12:00</option>
            <option value="16:00">오후 16:00</option>
            <option value="20:00">오후 20:00</option>
        </select>
        
        <br><br>
        <label for="seats">예약인원:</label>
        <input type="number" id="mperson" name="mperson" min="1" required>
        <br><br>
        <button type="submit">예약하기</button>
    </form>
    
    
<script>
const person =" ${person}"; //백엔드 코드 js는 직접 못 받으니 model로 받기
</script>
</body>
<script src="./movie_reserve.js?v=1"></script>
</html>
